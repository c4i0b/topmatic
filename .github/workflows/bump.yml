name: bump

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      TOPMATIC_DIRECT: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pinned for reproducibility; bump deliberately as part of a change.
      JUST_VERSION: "1.44.0"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install tooling for the bump flow
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq systemd
          mkdir -p "$HOME/.local/bin"
          if ! command -v just >/dev/null 2>&1; then
            echo "just not found on the runner image; installing"
            fetch() { curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors "$@"; }
            if fetch "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
                | tar -xz -C "$HOME/.local/bin" just; then
              echo "installed just ${JUST_VERSION} from GitHub releases"
            elif fetch https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"; then
              echo "installed just via just.systems installer"
            else
              echo "falling back to cargo install (slow)"
              cargo install just --locked
            fi
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          just --version
          git config --global credential.helper '!gh auth git-credential'
          git config --global user.name "topmatic-bump-bot"
          git config --global user.email "actions@users.noreply.github.com"
      # GITHUB_TOKEN events do not trigger the ci workflow on the PR
      # branch, so the full gate runs HERE and the merge below is the
      # only thing after it. --no-merge: the merge is explicit below.
      # No nix responsibilities: the nix package is release-pinned and
      # advanced only by the nix-release workflow.
      - name: Bump dependencies and image tags
        id: bump
        run: |
          if python3 tools/bump.py --no-merge; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge
        if: steps.bump.outputs.bumped == 'true'
        run: |
          # bump.py exits 0 both when it opened a PR and when there was
          # nothing to bump — only merge when the branch PR exists
          if gh pr view "bump/$(date +%Y%m%d)" >/dev/null 2>&1; then
            gh pr merge "bump/$(date +%Y%m%d)" --squash --delete-branch
          else
            echo "nothing to bump (no PR to merge)"
          fi
      - name: Nothing to bump
        if: steps.bump.outputs.bumped != 'true'
        run: echo "no PR to merge (nothing to bump)"
