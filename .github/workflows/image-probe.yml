name: image-probe

on: workflow_dispatch

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - name: Report preinstalled tooling
        run: |
          check() { printf '%-10s' "$1"; shift; "$@" >/dev/null 2>&1 && "$@" 2>&1 | head -1 || echo MISSING; }
          check just just --version
          check systemd systemctl --version
          check gh gh --version
          check python3 python3 --version
          check git git --version
          check curl curl --version
          check rustc rustc --version
          check cargo cargo --version
