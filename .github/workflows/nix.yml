name: nix

on:
  push:
    branches: [main]
    paths:
      - "nix/**"
      - "default.nix"
      - "flake.*"
      - "tools/nix_channels_check.py"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "nix/**"
      - "default.nix"
      - "flake.*"
      - "tools/nix_channels_check.py"
      - ".github/workflows/nix.yml"

permissions:
  contents: read

jobs:
  channels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate all nix surfaces
        run: python3 tools/nix_channels_check.py
