name: nix-release

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: nix-release-update
  cancel-in-progress: false

jobs:
  update:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the tagged Cargo.toml matches the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a stable release tag: $TAG" >&2
            exit 1
          fi
          git fetch origin "$TAG" --depth=1
          tagged=$(git show "$TAG:Cargo.toml" | grep -m1 '^version =' | sed -E 's/version = "([^"]+)"/\1/')
          if [ "$version" != "$tagged" ]; then
            echo "tag $TAG carries Cargo.toml version $tagged" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        id: version

      - name: Update the pinned package with nix-update
        run: |
          nix run nixpkgs#nix-update -- \
            topmatic \
            --flake \
            --version="${{ steps.version.outputs.version }}" \
            --override-filename nix/package.nix \
            --build

      - name: Commit to main
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no nix changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/package.nix
          git commit -m "nix: update topmatic to v${{ steps.version.outputs.version }}"
          git push origin HEAD:main
